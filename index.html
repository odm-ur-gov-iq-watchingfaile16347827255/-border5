<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مولّد QR</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; font-family:Tahoma; }
    .container { max-width:500px; margin-top:50px; }
    #qrcode { margin-top:20px; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-3 text-center">🔗 توليد QR Code</h2>

    <div class="input-group mb-3">
      <input id="text" type="text" class="form-control" placeholder="أدخل رابط أو نص">
      <button id="generate" class="btn btn-primary">إنشاء</button>
    </div>

    <div id="qrcode"></div>
  </div>

  <!-- مكتبة jQuery -->
  <script src="jquery.slim.min.js"></script>
  <!-- مكتبة QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <script>
    $(function() {
      const qrContainer = document.getElementById("qrcode");
      let qr = null;

      $("#generate").on("click", function() {
        const text = $("#text").val().trim();
        if (!text) {
          alert("⚠️ الرجاء إدخال نص أو رابط");
          return;
        }

        // تنظيف القديم
        qrContainer.innerHTML = "";

        // توليد جديد
        qr = new QRCode(qrContainer, {
          text: text,
          width: 256,
          height: 256,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    });
  </script>
</body>
</html>
